name: Find failures

permissions: {}

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only allow one instance of this workflow for each PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  failures:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - pretalx
          - pretix

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
      - uses: extractions/setup-just@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find failure cases
        run: just find-failures ${{ matrix.package }} --django-settings ${{ matrix.package }}.settings

      - name: Upload findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failures-${{ matrix.package }}
          path: failures-*
          if-no-files-found: ignore
