name: CI

permissions: {}

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only allow one instance of this workflow for each PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
      - uses: extractions/setup-just@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting and linting
        run: just check

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
      - name: "Build package"
        run: "uv build"
      - name: "List result"
        run: "ls -l dist"
      - name: "Check wheel contents"
        run: "uvx check-wheel-contents --toplevel classify dist/*.whl"
      - name: "Check long_description"
        run: "uvx twine check dist/*"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "latest"
      - uses: extractions/setup-just@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: uv run -m nox --python ${{ matrix.python-version }}

  verify-lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
